<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commandos 3 – Hombres de Valor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Special+Elite&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<canvas id="ui"></canvas>

<div id="objectives"></div>
<div id="minimap-wrap"><canvas id="mini" width="256" height="176"></canvas></div>
<div id="toast"></div>

<div id="hud">
  <div id="main-panel" class="leather">
    <div id="portrait-frame"><canvas id="portrait" width="112" height="128"></canvas></div>
    <div id="unit-info">
      <div id="unit-name"></div>
      <div id="unit-hp"></div>
      <div id="unit-state"></div>
      <div id="abil"></div>
    </div>
    <div id="backpack">
      <div class="bp-title">MOCHILA</div>
      <div id="inv"></div>
    </div>
  </div>
  <div id="squad" class="leather"></div>
  <div id="hint" class="leather"></div>
</div>

<div id="tactical"><div class="tframe"><div class="ttitle">MAPA TÁCTICO <small>F9 / Esc para cerrar</small></div><canvas id="tmap" width="960" height="660"></canvas>
<div class="tlegend"><span style="color:#4cff3a">●</span> Comandos · <span style="color:#d83a2a">●</span> Enemigos y su mirada · <span style="color:#d03020">⚑</span> Objetivo principal · <span style="color:#e8c030">⚑</span> Objetivo opcional / objetos · <span style="color:#3a8ae0">⚑</span> Extracción</div></div></div>
<div id="overlay"></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/three-extras.js"></script>
<script src="assets/textures.js"></script>
<script src="assets/models.js"></script>
<script src="js/util.js"></script>
<script src="js/textures.js"></script>
<script src="js/assets.js"></script>
<script src="js/level.js"></script>
<script src="js/items.js"></script>
<script src="js/entities.js"></script>
<script src="js/hudart.js"></script>
<script src="js/models.js"></script>
<script src="js/characters.js"></script>
<script src="js/render3d.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
<script src="js/input.js"></script>
<script src="js/hud.js"></script>
</body>
</html>
